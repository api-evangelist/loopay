aid: loopay
name: Loopay
description: >-
  Loopay is a Latin American B2B fintech infrastructure company headquartered in
  Bogotá, Colombia and backed by 500 Global. It provides cross-border and local
  business payments, international collections, mass payouts, multi-currency
  Banking-as-a-Service accounts, automated bank reconciliation, and treasury
  management for companies operating across Colombia, Peru, Mexico, and Ecuador.
  Loopay exposes a token-authenticated REST API (OpenAPI 3.0, 31 operations) that
  lets platforms create and track payouts, manage sources of payment and
  pay-ins, group affiliates, and read balances and ledger movements — settling
  supplier and beneficiary payments in under 24 hours.
